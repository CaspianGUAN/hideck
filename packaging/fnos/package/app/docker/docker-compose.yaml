name: hideck-fnos

services:
  hideck:
    image: "@IMAGE@"
    container_name: hideck-fnos
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    network_mode: host
    privileged: true
    volumes:
      - type: bind
        source: "${TRIM_PKGETC:?fnOS configuration directory is required}"
        target: /app/config
      - type: bind
        source: "${TRIM_PKGVAR:?fnOS data directory is required}/data"
        target: /app/data
      - type: bind
        source: "${TRIM_PKGVAR:?fnOS data directory is required}/logs"
        target: /app/logs
      # USB re-enumeration changes serial, ADB and PCM device nodes.
      - /dev:/dev
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/config/config.yaml
      PROXY_SERVER_PORT: "${TRIM_SERVICE_PORT:?fnOS service port is required}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:${TRIM_SERVICE_PORT}/ping"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
